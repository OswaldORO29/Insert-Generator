<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insert Generator IA</title>
    <!-- <link rel="icon" type="image/png" href="./imagenes/nodes.png" /> -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-title">
        <!-- <img class="page-icon" src="./imagenes/nodes.png" alt="Icono Insert Generator IA" /> -->
        <div>
          <p class="eyebrow">Proyecto IA</p>
          <h1>Insert Generator</h1>
        </div>
      </div>
      <p class="subtitle">Genera, visualiza e inserta datos sintéticos en tus tablas con ayuda de inteligencia artificial.</p>
    </header>

    <main class="grid">
      <section class="card">
    <h2>Configuración</h2>

    <!-- Zona 1 -->
    <div class="bloque">
        <label for="input-url-backend">Dirección del Servidor / URL de la API</label>
        <input id="input-url-backend" type="text" placeholder="http://192.168.1.10:8080" />

        <div class="actions">
            <button id="conectarBtn" class="secondary">Conectar</button>
        </div>
    </div>

    <!-- Zona 2 -->
    <div class="bloque">
        <label for="tablaSelect">Tabla</label>
        <select id="tablaSelect"></select>

        <label for="cantidadInput">Cantidad de registros</label>
        <input id="cantidadInput" type="number" min="1" max="1000" value="10" />

        <div class="actions">
            <button id="generarBtn">Generar datos</button>
        </div>
    </div>

    <div id="status" class="status" role="status">
        Listo para comenzar.
    </div>
</section>

<section class="card">
    <h2>Estructura de la tabla</h2>
    <div id="estructuraContenido" class="empty-state">
        Selecciona una tabla para ver sus columnas.
    </div>
</section>

<section class="card wide">
    <h2>Vista previa de datos</h2>

    <div id="resumen" class="summary"></div>

    <pre id="previewOutput">{}</pre>

    <div class="actions">
        <button id="insertarBtn" class="secondary">
            Insertar en BD
        </button>
    </div>
</section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
